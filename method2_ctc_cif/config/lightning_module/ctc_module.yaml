# CTC Gesture Module config
_target_: emg_transfer.lightning.CtcGestureModule

optimizer:
  _target_: torch.optim.Adam
  lr: 5e-4
  _partial_: true

network:
  _target_: emg_transfer.networks.CtcGestureArchitecture
  d_model: 256
  num_layers: 8
  num_heads: 4
  conv_kernel_size: 15
  ff_expansion_factor: 4
  dropout: 0.1
  encoder_output_dim: 256
  num_classes: 9
  subsampling_stride: 40

learning_rate: 5e-4
lr_scheduler_milestones: [25]
lr_scheduler_factor: 0.5
warmup_start_factor: 0.001
warmup_end_factor: 1.0
warmup_total_epochs: 5
gradient_clip_val: 0.5
freeze_backbone_epochs: 5
backbone_lr_ratio: 0.02
