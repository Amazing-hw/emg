_target_: emg_transfer.lightning.DiscreteGesturesModule

optimizer:
  _target_: torch.optim.Adam
  lr: 5e-4
  _partial_: true

# -- Network: Conformer model (Method 1) --
network:
  _target_: emg_transfer.networks.ConformerGestureArchitecture
  d_model: 256
  num_layers: 8
  num_heads: 4
  conv_kernel_size: 15
  ff_expansion_factor: 4
  dropout: 0.1
  output_dim: 64
  lstm_hidden: 128
  num_classes: 9
  use_lstm_head: true
  subsampling_stride: 40

