# wav2vec 2.0 pre-training config
method: wav2vec2

# Data
data_dir: D:/emg/emg2pose1/emg2pose-main/emg2pose-main/emg2pose_dataset/emg2pose_data
window_length: 16000    # 8 seconds at 2kHz
stride: 8000            # 50% overlap
batch_size: 8
max_files: 200          # Use up to 200 HDF5 files
max_windows_per_file: 50
num_workers: 0

# Model architecture
feature_dim: 512
context_dim: 256
num_conformer_layers: 8
num_heads: 4
conv_kernel_size: 15
dropout: 0.1

# Quantization
num_quantizer_groups: 2
num_quantizer_vars: 320

# Masking
mask_prob: 0.5
mask_length: 5           # 5 frames * 20ms = 100ms at 50Hz

# Training
seed: 42
max_epochs: 100
learning_rate: 5e-4
warmup_steps: 10000
contrastive_temp: 0.1
diversity_weight: 0.1
gradient_clip_val: 1.0
accelerator: gpu
devices: 1

# Checkpoints
checkpoint_dir: ./ssl_checkpoints
